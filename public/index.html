<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Payment Company</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}
header{background:#111827;color:white;padding:20px;text-align:center}
.container{max-width:700px;margin:40px auto;padding:20px}
.card{background:white;border-radius:14px;padding:28px;box-shadow:0 5px 25px rgba(0,0,0,.08)}
h1{margin-top:0}
.amount{font-size:28px;font-weight:bold;margin:20px 0}
label{display:block;margin-top:16px;margin-bottom:6px;font-weight:bold}
input{width:100%;padding:13px;border:1px solid #ccd3da;border-radius:8px;font-size:16px}
button{width:100%;margin-top:24px;padding:14px;border:0;border-radius:8px;background:#111827;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
#result{margin-top:20px;padding:14px;border-radius:8px;display:none;white-space:pre-wrap}
.info{background:#eef2ff;padding:14px;border-radius:8px;margin:15px 0}
footer{text-align:center;padding:30px;color:#667085}
</style>
</head>
<body>

<header>
<strong>My Payment Company</strong>
</header>

<div class="container">
<div class="card">

<h1>Card Payment</h1>
<p>Enter your card details to continue.</p>

<div class="amount">KSh 1,000.00</div>

<div class="info">
Card authorization is currently being prepared.
This checkout will not claim a successful charge until
a real payment processor is connected.
</div>

<form id="paymentForm">

<label for="cardNumber">Card Number</label>
<input id="cardNumber" type="text" inputmode="numeric"
autocomplete="cc-number" placeholder="Card number" required>

<label for="expiry">Expiry</label>
<input id="expiry" type="text" inputmode="numeric"
autocomplete="cc-exp" placeholder="MM/YY" maxlength="5" required>

<label for="cvv">CVV</label>
<input id="cvv" type="password" inputmode="numeric"
autocomplete="cc-csc" placeholder="3-digit CVV" maxlength="3" required>

<button id="payButton" type="submit">Continue</button>

</form>

<div id="result"></div>

</div>
</div>

<footer>© 2026 My Payment Company</footer>

<script>
const form=document.getElementById("paymentForm");
const button=document.getElementById("payButton");
const result=document.getElementById("result");

form.addEventListener("submit",async function(event){
  event.preventDefault();

  const cardNumber=document.getElementById("cardNumber").value.replace(/\s/g,"");
  const expiry=document.getElementById("expiry").value.trim();
  const cvv=document.getElementById("cvv").value.trim();

  if(!cardNumber){
    showResult("Enter your card number.");
    return;
  }

  if(!/^\d{2}\/\d{2}$/.test(expiry)){
    showResult("Enter expiry as MM/YY.");
    return;
  }

  if(!/^\d{3}$/.test(cvv)){
    showResult("Enter a 3-digit CVV.");
    return;
  }

  button.disabled=true;
  button.textContent="Processing...";
  result.style.display="none";

  try{
    const response=await fetch("/checkout/card",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        amount:1000,
        cardNumber,
        expiry,
        cvv
      })
    });

    const data=await response.json();

    if(!response.ok){
      showResult(data.error || "Checkout unavailable.");
      return;
    }

    showResult("Payment status: "+(data.status || "PENDING"));

  }catch(error){
    showResult("Unable to contact the payment server.");
  }finally{
    button.disabled=false;
    button.textContent="Continue";
  }
});

function showResult(message){
  result.textContent=message;
  result.style.display="block";
}
</script>

</body>
</html>
