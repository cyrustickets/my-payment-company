<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .login,
    .dashboard {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    input, button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
    }

    input {
      border: 1px solid #d1d5db;
    }

    button {
      border: 0;
      background: #111827;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .stat small {
      color: #6b7280;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-top: 8px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    th {
      background: #f9fafb;
    }

    .success {
      color: #15803d;
      font-weight: bold;
    }

    .error {
      color: #b91c1c;
      margin-top: 10px;
    }

    .hidden {
      display: none;
    }

    .logout {
      width: auto;
      float: right;
      padding: 8px 14px;
      margin: 0;
      background: #374151;
    }
  </style>
</head>

<body>

<header>
  <button class="logout hidden" id="logoutButton">Logout</button>
  <h1>My Payment Company — Owner Dashboard</h1>
</header>

<main>

  <section class="login" id="loginBox">
    <h2>Owner Login</h2>

    <p>
      Enter your owner dashboard secret to view payment records.
    </p>

    <input
      id="ownerSecret"
      type="password"
      placeholder="Owner dashboard secret"
      autocomplete="off"
    >

    <button id="loginButton">
      Open Dashboard
    </button>

    <div class="error" id="loginError"></div>
  </section>


  <section class="dashboard hidden" id="dashboard">

    <h2>Payment Overview</h2>

    <div class="cards">

      <div class="stat">
        <small>Total Payments</small>
        <strong id="totalPayments">0</strong>
      </div>

      <div class="stat">
        <small>Total Amount</small>
        <strong id="totalAmount">KSh 0.00</strong>
      </div>

      <div class="stat">
        <small>Successful</small>
        <strong id="successfulPayments">0</strong>
      </div>

    </div>

    <h2>Payment History</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Transaction</th>
            <th>Amount</th>
            <th>Card</th>
            <th>Status</th>
            <th>Date</th>
          </tr>
        </thead>

        <tbody id="paymentRows"></tbody>
      </table>
    </div>

    <p id="dashboardError" class="error"></p>

  </section>

</main>

<script>

let ownerSecret = "";

const loginBox =
  document.getElementById("loginBox");

const dashboard =
  document.getElementById("dashboard");

const loginError =
  document.getElementById("loginError");

const dashboardError =
  document.getElementById("dashboardError");

const logoutButton =
  document.getElementById("logoutButton");


async function loadPayments() {

  dashboardError.textContent = "";

  try {

    const response = await fetch(
      "/owner/payments",
      {
        headers: {
          "X-Owner-Secret": ownerSecret
        }
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Unable to load payments"
      );
    }

    renderPayments(data.payments || []);

  } catch (error) {

    dashboardError.textContent =
      error.message;
  }
}


function renderPayments(payments) {

  document.getElementById(
    "totalPayments"
  ).textContent = payments.length;

  let total = 0;
  let successful = 0;

  const rows =
    document.getElementById("paymentRows");

  rows.innerHTML = "";

  payments.forEach(payment => {

    const amount =
      Number(payment.amountMinor || 0) / 100;

    total += amount;

    if (payment.status === "SUCCESS") {
      successful++;
    }

    const row =
      document.createElement("tr");

    row.innerHTML = `
      <td>${escapeHtml(payment.id || "")}</td>
      <td>KSh ${amount.toLocaleString(
        "en-KE",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      )}</td>
      <td>****${escapeHtml(
        payment.cardLast4 || "----"
      )}</td>
      <td class="success">
        ${escapeHtml(payment.status || "")}
      </td>
      <td>${escapeHtml(
        payment.createdAt
          ? new Date(payment.createdAt).toLocaleString()
          : ""
      )}</td>
    `;

    rows.appendChild(row);
  });

  document.getElementById(
    "totalAmount"
  ).textContent =
    "KSh " +
    total.toLocaleString(
      "en-KE",
      {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }
    );

  document.getElementById(
    "successfulPayments"
  ).textContent = successful;
}


function escapeHtml(value) {

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


document.getElementById(
  "loginButton"
).onclick = async () => {

  const secret =
    document.getElementById(
      "ownerSecret"
    ).value.trim();

  if (!secret) {
    loginError.textContent =
      "Enter your owner secret.";
    return;
  }

  ownerSecret = secret;

  loginError.textContent = "";

  try {

    const response = await fetch(
      "/owner/payments",
      {
        headers: {
          "X-Owner-Secret": ownerSecret
        }
      }
    );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Login failed"
      );
    }

    loginBox.classList.add("hidden");
    dashboard.classList.remove("hidden");
    logoutButton.classList.remove("hidden");

    renderPayments(data.payments || []);

  } catch (error) {

    ownerSecret = "";

    loginError.textContent =
      "Login failed: " + error.message;
  }
};


logoutButton.onclick = () => {

  ownerSecret = "";

  dashboard.classList.add("hidden");
  logoutButton.classList.add("hidden");
  loginBox.classList.remove("hidden");

  document.getElementById(
    "ownerSecret"
  ).value = "";
};


</script>

</body>
</html>
